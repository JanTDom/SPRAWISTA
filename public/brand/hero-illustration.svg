<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E1E3E7" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172338" flood-opacity="0.06"/>
    </filter>
    <filter id="focus-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#355CFF" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient canvas background with blueprint alignment grid -->
  <rect width="800" height="520" rx="16" fill="#F6F5F1" />
  <rect x="20" y="20" width="760" height="480" rx="12" fill="url(#grid)" />

  <!-- LEFT ZONE: "Rozproszony materiał procesowy" (Raw Dossier Chunks) -->
  <!-- Document 1: Faktura VAT (Raw source) -->
  <g transform="translate(60, 90) rotate(-4)" filter="url(#card-shadow)">
    <rect width="210" height="150" rx="6" fill="#FFFFFF" stroke="#E1E3E7" stroke-width="1.2" />
    <rect x="16" y="16" width="70" height="8" rx="2" fill="#172338" />
    <rect x="16" y="32" width="120" height="5" rx="1.5" fill="#8C93A0" />
    <line x1="16" y1="50" x2="194" y2="50" stroke="#E1E3E7" stroke-width="1" />
    <!-- Table rows -->
    <rect x="16" y="62" width="90" height="6" rx="1.5" fill="#5F6774" />
    <rect x="140" y="62" width="54" height="6" rx="1.5" fill="#172338" />
    <rect x="16" y="78" width="80" height="6" rx="1.5" fill="#5F6774" />
    <rect x="140" y="78" width="54" height="6" rx="1.5" fill="#172338" />
    <rect x="16" y="94" width="70" height="6" rx="1.5" fill="#5F6774" />
    <rect x="140" y="94" width="54" height="6" rx="1.5" fill="#172338" />
    <!-- Highlighted discrepancy amount -->
    <rect x="12" y="112" width="186" height="24" rx="3" fill="#FEF7E0" stroke="#B06000" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="128" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#B06000">KWOTA: 147 600,00 PLN (SPORNA)</text>
    <text x="148" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#5F6774">Karta 14</text>
  </g>

  <!-- Document 2: Protokół odbioru z uwagami -->
  <g transform="translate(80, 270) rotate(3)" filter="url(#card-shadow)">
    <rect width="220" height="170" rx="6" fill="#FFFFFF" stroke="#E1E3E7" stroke-width="1.2" />
    <rect x="16" y="16" width="90" height="8" rx="2" fill="#172338" />
    <rect x="16" y="32" width="110" height="5" rx="1.5" fill="#8C93A0" />
    <line x1="16" y1="48" x2="204" y2="48" stroke="#E1E3E7" stroke-width="1" />
    <!-- Paragraph lines -->
    <rect x="16" y="60" width="180" height="5" rx="1.5" fill="#5F6774" />
    <rect x="16" y="72" width="170" height="5" rx="1.5" fill="#5F6774" />
    <rect x="16" y="84" width="160" height="5" rx="1.5" fill="#5F6774" />
    <!-- Key highlighted sentence: "Wady istotne zgłoszone w terminie" -->
    <rect x="12" y="102" width="196" height="46" rx="4" fill="#EEF2FF" stroke="#355CFF" stroke-width="1.5" />
    <circle cx="24" cy="116" r="3" fill="#355CFF" />
    <text x="32" y="119" font-family="Manrope, sans-serif" font-size="10" font-weight="600" fill="#172338">§ 4 ust. 2: Zgłoszenie wad</text>
    <text x="32" y="136" font-family="Manrope, sans-serif" font-size="9" fill="#5F6774">Odmowa podpisania protokołu końcowego</text>
    <text x="156" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#5F6774">Karta 28</text>
  </g>

  <!-- CENTER VECTOR: Precise Cobalt Line of Synthesis (Vector from Source to Pleading) -->
  <path d="M295 385 C 360 385, 380 270, 440 270" stroke="#355CFF" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />
  <circle cx="295" cy="385" r="4.5" fill="#355CFF" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Indicator pill on the vector: "Art. 647 K.c. / art. 458(5) K.p.c." -->
  <g transform="translate(325, 290)">
    <rect width="130" height="24" rx="12" fill="#172338" />
    <text x="12" y="16" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#F6F5F1">ZARZUT WAD UMOWY</text>
  </g>
  <path d="M435 270 L 448 270" stroke="#355CFF" stroke-width="2.5" />
  <circle cx="448" cy="270" r="5" fill="#355CFF" stroke="#FFFFFF" stroke-width="2" />

  <!-- RIGHT ZONE: "Uporządkowana argumentacja i projekt pisma" (The Procedural Pleading) -->
  <g transform="translate(450, 45)" filter="url(#focus-shadow)">
    <!-- Master Document Sheet -->
    <rect width="300" height="430" rx="8" fill="#FFFFFF" stroke="#172338" stroke-width="1.8" />
    
    <!-- Pleading Header -->
    <g transform="translate(24, 24)">
      <text x="160" y="12" font-family="Manrope, sans-serif" font-size="9" fill="#5F6774" text-anchor="end">Warszawa, 11 września 2026 r.</text>
      <text x="0" y="30" font-family="Newsreader, serif" font-size="13" font-weight="600" fill="#172338">Sąd Rejonowy dla m.st. Warszawy</text>
      <text x="0" y="44" font-family="Manrope, sans-serif" font-size="9" fill="#5F6774">XVI Wydział Gospodarczy</text>
      <text x="0" y="58" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#355CFF">Sygn. akt XVI GC 1420/26</text>
    </g>

    <line x1="24" y1="96" x2="276" y2="96" stroke="#E1E3E7" stroke-width="1" />

    <!-- Title of pleading -->
    <text x="150" y="120" font-family="Newsreader, serif" font-size="14" font-weight="600" fill="#172338" text-anchor="middle" letter-spacing="-0.02em">ODPOWIEDŹ NA POZEW</text>

    <!-- Petitum points -->
    <g transform="translate(24, 140)">
      <rect x="0" y="0" width="252" height="34" rx="4" fill="#FAF9F6" stroke="#E1E3E7" stroke-width="1"/>
      <text x="8" y="14" font-family="Manrope, sans-serif" font-size="9" font-weight="600" fill="#172338">1. Wnoszę o oddalenie powództwa w całości</text>
      <text x="8" y="26" font-family="Manrope, sans-serif" font-size="8" fill="#5F6774">z uwagi na nienależyte wykonanie umowy (art. 471 K.c.)</text>
    </g>

    <!-- Argumentation block linked to the source vector -->
    <g transform="translate(24, 186)">
      <text x="0" y="12" font-family="Newsreader, serif" font-size="11" font-weight="600" fill="#172338">UZASADNIENIE</text>
      <rect x="0" y="20" width="252" height="4" rx="1" fill="#8C93A0" />
      <rect x="0" y="28" width="230" height="4" rx="1" fill="#8C93A0" />
      <rect x="0" y="36" width="245" height="4" rx="1" fill="#8C93A0" />

      <!-- Verified Assertion with Active Link Badge -->
      <rect x="-4" y="46" width="260" height="54" rx="4" fill="#EEF2FF" stroke="#355CFF" stroke-width="1.2"/>
      <text x="6" y="60" font-family="Manrope, sans-serif" font-size="8.5" font-weight="600" fill="#172338">Twierdzenie poparte dowodem:</text>
      <text x="6" y="74" font-family="Newsreader, serif" font-size="9.5" fill="#172338">Powód nie usunął wad zgłoszonych w protokole...</text>
      <!-- Evidence tag -->
      <rect x="6" y="81" width="90" height="14" rx="3" fill="#355CFF" />
      <text x="12" y="91" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="600" fill="#FFFFFF">DOWÓD: Karta 28 ↗</text>
      <text x="104" y="91" font-family="Manrope, sans-serif" font-size="7.5" fill="#137333">✓ Zweryfikowano</text>
    </g>

    <!-- Pre-sign audit badge -->
    <g transform="translate(24, 345)">
      <rect width="252" height="46" rx="6" fill="#F6F5F1" stroke="#E1E3E7" stroke-width="1" />
      <circle cx="16" cy="18" r="5" fill="#137333" />
      <path d="M14 18 L 15.5 19.5 L 18.5 16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="28" y="16" font-family="Manrope, sans-serif" font-size="9" font-weight="600" fill="#172338">Kontrola przed podpisem: 100% źródeł</text>
      <text x="28" y="28" font-family="Manrope, sans-serif" font-size="8" fill="#5F6774">Zero halucynacji • 3 zarzuty procesowe • Gotowe do DOCX</text>
      <rect x="180" y="32" width="64" height="10" rx="2" fill="#172338" />
      <text x="184" y="39.5" font-family="JetBrains Mono, monospace" font-size="6.5" fill="#F6F5F1">POBIERZ DOCX</text>
    </g>
  </g>
</svg>
